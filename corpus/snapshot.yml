# TermsGuard corpus - hand-picked EU + Big Tech companies
# Re-fetched weekly. Each entry: slug, display name, sector, policy URL.
#
# Notes on bot-protected companies (as of 2026-10-29):
# - BNP Paribas (group.bnpparibas.com): bot-blocked at corporate level,
#   no Wayback archive. Re-add once accessible mirror appears.
# - Carrefour (carrefour.com/fr): bot-blocked, no Wayback archive.
# - H&M retail (hm.com / www2.hm.com): bot-blocked. H&M Group's
#   corporate parent (hmgroup.com) is the proxy that works.
# - Santander (santander.com): bot-blocked at corporate level. Bank-level
#   privacy policy at bancosantander.es works but is rate-limited
#   intermittently. Kept as a flaky but mostly-working URL.
# - BBVA, CaixaBank, Klarna, Zalando, Ahold Delhaize, Zurich Insurance:
#   same pattern. Corporate-level bot-protection, no clean Wayback
#   archive. Will revisit if/when a mirror URL appears.
#
# Other companies occasionally fail with 429s (rate-limited). The
# snapshot script retries with exponential backoff, then falls back
# to Wayback Machine. All live URLs are listed as the canonical URL;
# the script's Wayback fallback is implicit, not in the YAML.

companies:
  # Big Tech (6) - Irish HQs, GDPR-regulated. All work reliably.
  - slug: google
    name: Google
    sector: Big Tech
    url: https://policies.google.com/privacy
  - slug: meta
    name: Meta
    sector: Big Tech
    # Meta/Facebook's "Privacy Principles" explainer page. The actual
    # Data Policy at facebook.com/policy.php is bot-protected.
    url: https://www.facebook.com/help/325807682359234
  - slug: apple
